version: '3.8'
services:
  backend:
    image: ghcr.io/malik-hamza2/three-tier-app-backend:latest
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    user: "1000:1000"
    read_only: true
    restart: always
    networks:
      - app-network
  frontend:
    image: ghcr.io/malik-hamza2/three-tier-app-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    user: "1000:1000"
    read_only: true
    restart: always
    networks:
      - app-network
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - app-network
volumes:
  mongo-data:
networks:
  app-network:
    driver: bridge

